server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # API проксируется через главный nginx, здесь клиент отдаёт только статику и SPA-fallback.
  location / {
    try_files $uri /index.html;
  }

  # Долгоживущие ассеты (хэшированные имена) кэшируем агрессивно.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}